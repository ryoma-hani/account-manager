name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/configure-pages@v5.0.0
      - name: Copy public files
        run: |
          mkdir _site
          cp index.html favicon.svg .nojekyll _site/
          cp -R css js _site/
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4.0.5
